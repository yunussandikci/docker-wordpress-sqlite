name: Automated Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      rebuild_tags:
        description: 'Space-separated tags to rebuild (bypasses tags.txt check). Leave empty for normal cron diff.'
        required: false
        default: ''

jobs:
  cron:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch WordPress Tags
        id: fetch-tags
        if: ${{ inputs.rebuild_tags == '' }}
        run: |
          # Entries are "tag@digest", so upstream rebuilds of an existing tag (e.g. PHP security patches) are detected too
          ENTRIES=""
          for page in {1..3}; do
            page_entries=$(curl -s "https://registry.hub.docker.com/v2/repositories/library/wordpress/tags/?page_size=100&page=${page}" | \
              jq -r '.results[] | select(.name | test("^(cli|beta)") | not) | "\(.name)@\(.digest)"' | tr '\n' ' ')
            ENTRIES="${ENTRIES} ${page_entries}"
            echo "Fetched tags from page ${page}"
          done
          echo "Tags fetched: ${ENTRIES}"
          echo "entries=${ENTRIES}" >> $GITHUB_OUTPUT

      - name: Compare Tags
        id: compare-tags
        run: |
          if [ -n "${{ inputs.rebuild_tags }}" ]; then
            NEW_ENTRIES="${{ inputs.rebuild_tags }}"
          else
            touch tags.txt
            NEW_ENTRIES=$(echo "${{ steps.fetch-tags.outputs.entries }}" | tr ' ' '\n' | grep -v '^$' | grep -Fxvf tags.txt | tr '\n' ' ' | sed 's/ *$//')
          fi
          echo "New tags: $(echo "${NEW_ENTRIES}" | sed 's/@[^ ]*//g')"
          echo "new_entries=${NEW_ENTRIES}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: ${{ steps.compare-tags.outputs.new_entries != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push new tags
        if: ${{ steps.compare-tags.outputs.new_entries != '' }}
        run: |
          # Tags sharing a digest are upstream aliases (e.g. "php8.4-apache" and "7.1.3-php8.4-apache"), so each digest is built once, from that exact digest, and pushed under all of them
          echo "${{ steps.compare-tags.outputs.new_entries }}" | tr ' ' '\n' | \
            awk -F@ 'NF { if (!($NF in from)) from[$NF] = $0; tags[$NF] = tags[$NF] " " $1 } END { for (key in from) print from[key] tags[key] }' | \
            while read -r FROM TAGS; do
              ARGS=()
              for TAG in ${TAGS}; do
                ARGS+=(-t "ghcr.io/${{ github.repository_owner }}/wordpress-sqlite:${TAG}")
              done
              echo "Building and pushing tags: ${TAGS}"
              docker buildx build \
                --platform linux/amd64,linux/arm/v7,linux/arm64/v8 \
                --push \
                --build-arg TAG="${FROM}" \
                --provenance=false \
                "${ARGS[@]}" .
            done

      - name: Push changes
        if: ${{ steps.compare-tags.outputs.new_entries != '' && inputs.rebuild_tags == '' }}
        run: |
          echo "${{ steps.compare-tags.outputs.new_entries }}" | tr ' ' '\n' | while read -r ENTRY; do
            awk -F@ -v tag="${ENTRY%%@*}" 'NF && $1 != tag' tags.txt > tags.tmp
            echo "${ENTRY}" >> tags.tmp
            mv tags.tmp tags.txt
          done
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add tags.txt
          git commit -m "Automated update."
          git push
